name: Terraform EKS

on:
  push:
    branches:
      - main
    paths:
      - "eks-terraform/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose APPLY to create/update infrastructure or DESTROY to remove it"
        required: true
        type: choice
        options:
          - APPLY
          - DESTROY
      confirm:
        description: "Select the same operation to confirm"
        required: true
        type: choice
        options:
          - NO
          - APPLY
          - DESTROY

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  plan:
    name: Initialize and plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: eks-terraform
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Check main branch and requested operation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          ROLE_ARN: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main only."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$OPERATION" != "APPLY" ] && [ "$OPERATION" != "DESTROY" ]; then
              echo "::error::Choose APPLY or DESTROY."
              exit 1
            fi
            if [ "$CONFIRM" != "$OPERATION" ]; then
              echo "::error::Select the same operation in the confirmation field."
              exit 1
            fi
          fi
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Configure repository variable TERRAFORM_AWS_ROLE_ARN."
            exit 1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Configure repository variable TF_STATE_BUCKET."
            exit 1
          fi
          if [ -z "$AWS_REGION" ]; then
            echo "::error::Configure repository variable TF_STATE_REGION."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=unit-converter/eks/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create automatic plan
        if: github.event_name == 'push'
        run: terraform plan -input=false -no-color

      - name: Create apply plan
        if: inputs.operation == 'APPLY'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Create destroy plan
        if: inputs.operation == 'DESTROY'
        run: terraform plan -destroy -input=false -no-color -out=tfplan

      - name: Save plan for approval
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: eks-terraform/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply approved plan
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: eks-production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: eks-terraform
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.TF_STATE_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=unit-converter/eks/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: eks-terraform

      - name: Apply approved plan
        run: terraform apply -input=false -no-color tfplan
